name: Terraform CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1

      - name: Clone Terraform code from CodeCommit
        run: |
          git config --global credential.helper '!aws codecommit credential-helper $@'
          git config --global credential.UseHttpPath true
          git clone https://git-codecommit.eu-west-1.amazonaws.com/v1/repos/terraform-infra infra
          cd infra

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format
        run: cd infra && terraform fmt -check -recursive

      - name: Terraform Init
        run: cd infra && terraform init

      - name: Terraform Validate
        run: cd infra && terraform validate

      - name: Terraform Plan
        run: cd infra && terraform plan

      - name: Terraform Apply (on main only)
        if: github.ref == 'refs/heads/main'
        run: cd infra && terraform apply -auto-approve
